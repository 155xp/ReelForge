# Builds the downloads for a release and publishes it when a version tag (v1.2.3) is pushed.
# Run it by hand (Actions tab, Run workflow) to build the downloads without publishing anything.
# ReelForge has no installer: the one-line installs (scripts/install.ps1 and install.sh, attached to every release)
# fetch these downloads, and so does the Updates tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  packages:
    name: Windows zip, macOS zip, Linux tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the packages
        run: python scripts/package.py --out dist --version "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Build the packages (untagged run)
        run: python scripts/package.py --out dist
        if: "!startsWith(github.ref, 'refs/tags/v')"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require passing tests for this exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" > "$RUNNER_TEMP/test-runs.json"
          python - <<'PY'
          import json, os, subprocess
          runs = json.load(open(os.environ["RUNNER_TEMP"] + "/test-runs.json"))["workflow_runs"]
          for run in runs:
              if run["head_sha"] != os.environ["GITHUB_SHA"]:
                  continue
              jobs = json.loads(subprocess.check_output([
                  "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run['id']}/jobs?per_page=100"
              ]))["jobs"]
              if any(j["name"] == "All required tests passed" and j["conclusion"] == "success" for j in jobs):
                  print("Verified passing tests:", run["html_url"])
                  break
          else:
              raise SystemExit("Release blocked: no passing required-test gate for this exact commit")
          PY
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checksums (the install lines and the Updates tab check downloads against them)
        run: python scripts/package.py --sums-only --out dist
      - name: Create the GitHub release with the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* scripts/install.ps1 scripts/install.sh --title "ReelForge $GITHUB_REF_NAME" --notes-file .github/release-notes.md
