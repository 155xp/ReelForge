# Builds the downloads for a release and publishes it when a version tag (v1.2.3) is pushed.
# Run it by hand (Actions tab, Run workflow) to build the downloads without publishing anything.
# ReelForge has no installer: the one-line installs (scripts/install.ps1 and install.sh, attached to every release)
# fetch these downloads, and so does the Updates tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    name: Windows zip, macOS zip, Linux tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the packages
        run: python scripts/package.py --out dist --version "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Build the packages (untagged run)
        run: python scripts/package.py --out dist
        if: "!startsWith(github.ref, 'refs/tags/v')"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checksums (the install lines and the Updates tab check downloads against them)
        run: python scripts/package.py --sums-only --out dist
      - name: Create the GitHub release with the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* scripts/install.ps1 scripts/install.sh --title "ReelForge $GITHUB_REF_NAME" --notes-file .github/release-notes.md
